<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30-Day Data Analyst Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-50: #E6F1FB; --blue-100: #B5D4F4; --blue-200: #85B7EB; --blue-400: #378ADD; --blue-600: #185FA5; --blue-800: #0C447C; --blue-900: #042C53;
    --teal-50: #E1F5EE; --teal-100: #9FE1CB; --teal-200: #5DCAA5; --teal-400: #1D9E75; --teal-600: #0F6E56; --teal-800: #085041; --teal-900: #04342C;
    --amber-50: #FAEEDA; --amber-100: #FAC775; --amber-200: #EF9F27; --amber-400: #BA7517; --amber-600: #854F0B; --amber-800: #633806; --amber-900: #412402;
    --purple-50: #EEEDFE; --purple-100: #CECBF6; --purple-200: #AFA9EC; --purple-400: #7F77DD; --purple-600: #534AB7; --purple-800: #3C3489; --purple-900: #26215C;
    --gray-50: #F1EFE8; --gray-100: #D3D1C7; --gray-200: #B4B2A9; --gray-400: #888780; --gray-600: #5F5E5A; --gray-800: #444441; --gray-900: #2C2C2A;
    --bg: #FAFAF8;
    --bg2: #F1EFE8;
    --surface: #FFFFFF;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1a18;
    --text2: #5F5E5A;
    --text3: #888780;
    --radius: 10px;
    --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141412;
      --bg2: #1e1e1b;
      --surface: #222220;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.18);
      --text: #F1EFE8;
      --text2: #B4B2A9;
      --text3: #888780;
      --blue-50: #042C53; --blue-100: #0C447C; --blue-200: #185FA5; --blue-800: #B5D4F4; --blue-900: #E6F1FB;
      --teal-50: #04342C; --teal-100: #085041; --teal-200: #0F6E56; --teal-800: #9FE1CB; --teal-900: #E1F5EE;
      --amber-50: #412402; --amber-100: #633806; --amber-200: #854F0B; --amber-800: #FAC775; --amber-900: #FAEEDA;
      --purple-50: #26215C; --purple-100: #3C3489; --purple-200: #534AB7; --purple-800: #CECBF6; --purple-900: #EEEDFE;
      --gray-50: #2C2C2A; --gray-100: #444441; --gray-200: #5F5E5A; --gray-800: #D3D1C7; --gray-900: #F1EFE8;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }
  .site-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 28px; height: 28px;
    background: var(--teal-400);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 16px; height: 16px; }
  .logo-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    letter-spacing: -0.02em;
  }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .reset-btn {
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    color: var(--text3);
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .reset-btn:hover { background: var(--bg2); color: var(--text2); }
  .main { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }
  .hero { margin-bottom: 28px; }
  .hero-title {
    font-size: 26px;
    font-weight: 300;
    letter-spacing: -0.03em;
    color: var(--text);
    margin-bottom: 4px;
  }
  .hero-title strong { font-weight: 500; }
  .hero-sub { font-size: 13px; color: var(--text3); margin-bottom: 20px; }
  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; text-align: center; }
  .stat-num { font-size: 24px; font-weight: 500; font-family: 'DM Mono', monospace; color: var(--text); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--text3); margin-top: 4px; text-transform: uppercase; letter-spacing: .06em; }
  .prog-wrap { margin-bottom: 4px; }
  .prog-track { height: 6px; background: var(--bg2); border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
  .prog-fill { height: 100%; background: var(--teal-400); border-radius: 3px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .prog-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; margin-top: 5px; }
  .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .view-tabs { display: flex; background: var(--bg2); border-radius: var(--radius); padding: 3px; border: 1px solid var(--border); }
  .vt { font-size: 12px; font-family: 'DM Sans', sans-serif; font-weight: 500; padding: 6px 16px; border-radius: 8px; border: none; background: none; color: var(--text3); cursor: pointer; transition: all .15s; }
  .vt.active { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text3); }
  .leg-dot { width: 8px; height: 8px; border-radius: 2px; }
  .week-section { margin-bottom: 24px; }
  .week-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 10px; border: 1px solid; }
  .wk1-hd { background: var(--blue-50); border-color: var(--blue-200); }
  .wk2-hd { background: var(--teal-50); border-color: var(--teal-200); }
  .wk3-hd { background: var(--amber-50); border-color: var(--amber-100); }
  .wk4-hd { background: var(--purple-50); border-color: var(--purple-200); }
  .wk-badge { font-size: 10px; font-weight: 500; font-family: 'DM Mono', monospace; padding: 3px 9px; border-radius: 20px; letter-spacing: .04em; flex-shrink: 0; }
  .wk1-hd .wk-badge { background: var(--blue-100); color: var(--blue-900); }
  .wk2-hd .wk-badge { background: var(--teal-100); color: var(--teal-900); }
  .wk3-hd .wk-badge { background: var(--amber-100); color: var(--amber-900); }
  .wk4-hd .wk-badge { background: var(--purple-100); color: var(--purple-900); }
  .wk-title { font-size: 13px; font-weight: 500; }
  .wk1-hd .wk-title { color: var(--blue-800); }
  .wk2-hd .wk-title { color: var(--teal-800); }
  .wk3-hd .wk-title { color: var(--amber-800); }
  .wk4-hd .wk-title { color: var(--purple-800); }
  .wk-progress { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .wk-count { font-size: 11px; font-family: 'DM Mono', monospace; }
  .wk1-hd .wk-count { color: var(--blue-600); }
  .wk2-hd .wk-count { color: var(--teal-600); }
  .wk3-hd .wk-count { color: var(--amber-600); }
  .wk4-hd .wk-count { color: var(--purple-600); }
  .mini-bar { width: 56px; height: 4px; background: rgba(0,0,0,0.1); border-radius: 2px; overflow: hidden; }
  .mini-fill { height: 100%; border-radius: 2px; transition: width .3s; }
  .wk1-hd .mini-fill { background: var(--blue-600); }
  .wk2-hd .mini-fill { background: var(--teal-600); }
  .wk3-hd .mini-fill { background: var(--amber-600); }
  .wk4-hd .mini-fill { background: var(--purple-600); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-cell { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 9px 8px; cursor: pointer; transition: transform .12s, border-color .15s, background .15s; min-height: 84px; display: flex; flex-direction: column; user-select: none; position: relative; }
  .day-cell:hover { transform: translateY(-2px); border-color: var(--border2); }
  .day-cell:active { transform: translateY(0); }
  .day-cell.done-wk1 { background: var(--blue-50); border-color: var(--blue-400); }
  .day-cell.done-wk2 { background: var(--teal-50); border-color: var(--teal-400); }
  .day-cell.done-wk3 { background: var(--amber-50); border-color: var(--amber-200); }
  .day-cell.done-wk4 { background: var(--purple-50); border-color: var(--purple-400); }
  .dc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
  .dc-num { font-size: 15px; font-weight: 500; font-family: 'DM Mono', monospace; color: var(--text); line-height: 1; }
  .done-wk1 .dc-num { color: var(--blue-800); }
  .done-wk2 .dc-num { color: var(--teal-800); }
  .done-wk3 .dc-num { color: var(--amber-800); }
  .done-wk4 .dc-num { color: var(--purple-800); }
  .dc-circle { width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s; }
  .done-wk1 .dc-circle { background: var(--blue-400); border-color: var(--blue-400); }
  .done-wk2 .dc-circle { background: var(--teal-400); border-color: var(--teal-400); }
  .done-wk3 .dc-circle { background: var(--amber-200); border-color: var(--amber-200); }
  .done-wk4 .dc-circle { background: var(--purple-400); border-color: var(--purple-400); }
  .dc-topic { font-size: 10px; line-height: 1.4; color: var(--text3); flex: 1; }
  .done-wk1 .dc-topic, .done-wk2 .dc-topic, .done-wk3 .dc-topic, .done-wk4 .dc-topic { color: var(--text2); }
  .dc-tag { font-size: 9px; font-weight: 500; font-family: 'DM Mono', monospace; padding: 2px 6px; border-radius: 6px; margin-top: 6px; align-self: flex-start; letter-spacing: .02em; }
  .tag-sql { background: var(--blue-50); color: var(--blue-600); border: 1px solid var(--blue-200); }
  .tag-py { background: var(--teal-50); color: var(--teal-600); border: 1px solid var(--teal-200); }
  .tag-viz { background: var(--amber-50); color: var(--amber-600); border: 1px solid var(--amber-100); }
  .tag-proj { background: var(--purple-50); color: var(--purple-600); border: 1px solid var(--purple-200); }
  .tag-rest { background: var(--gray-50); color: var(--gray-600); border: 1px solid var(--gray-100); }
  .cl-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: background .12s, border-color .15s, transform .1s; margin-bottom: 5px; user-select: none; }
  .cl-item:hover { transform: translateX(2px); border-color: var(--border2); }
  .cl-item:active { transform: translateX(0); }
  .cl-item.done-wk1 { background: var(--blue-50); border-color: var(--blue-200); }
  .cl-item.done-wk2 { background: var(--teal-50); border-color: var(--teal-200); }
  .cl-item.done-wk3 { background: var(--amber-50); border-color: var(--amber-100); }
  .cl-item.done-wk4 { background: var(--purple-50); border-color: var(--purple-200); }
  .cl-circle { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; transition: all .2s; background: var(--bg); }
  .done-wk1 .cl-circle { background: var(--blue-400); border-color: var(--blue-400); }
  .done-wk2 .cl-circle { background: var(--teal-400); border-color: var(--teal-400); }
  .done-wk3 .cl-circle { background: var(--amber-200); border-color: var(--amber-200); }
  .done-wk4 .cl-circle { background: var(--purple-400); border-color: var(--purple-400); }
  .cl-body { flex: 1; min-width: 0; }
  .cl-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 3px; }
  .cl-badge { font-size: 10px; font-weight: 500; font-family: 'DM Mono', monospace; padding: 2px 8px; border-radius: 8px; }
  .wk1c .cl-badge { background: var(--blue-100); color: var(--blue-900); }
  .wk2c .cl-badge { background: var(--teal-100); color: var(--teal-900); }
  .wk3c .cl-badge { background: var(--amber-100); color: var(--amber-900); }
  .wk4c .cl-badge { background: var(--purple-100); color: var(--purple-900); }
  .cl-title { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .cl-item.done-wk1 .cl-title,
  .cl-item.done-wk2 .cl-title,
  .cl-item.done-wk3 .cl-title,
  .cl-item.done-wk4 .cl-title { text-decoration: line-through; color: var(--text3); }
  .cl-tasks { font-size: 11px; color: var(--text3); margin-top: 3px; line-height: 1.6; font-family: 'DM Mono', monospace; }
  .footer { text-align: center; padding: 40px 0 20px; font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
  .footer span { color: var(--teal-400); }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .week-section { animation: fadeUp .3s ease both; }
  .week-section:nth-child(2) { animation-delay:.05s }
  .week-section:nth-child(3) { animation-delay:.1s }
  .week-section:nth-child(4) { animation-delay:.15s }
  @media (max-width: 600px) {
    .cal-grid { grid-template-columns: repeat(4, 1fr); }
    .stats-row { grid-template-columns: 1fr 1fr; }
    .main { padding: 18px 14px 40px; }
    .hero-title { font-size: 20px; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 16 16" fill="none">
        <path d="M2 12L6 4l3 6 2-3 3 5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

</header>
<main class="main">

    <div class="hero-title"><strong>30-day</strong> data analyst journey</div>
    <div class="hero-sub">SQL · Python · Visualization · Portfolio project — click any day to mark it done</div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="s-done">0</div><div class="stat-label">Completed</div></div>
      <div class="stat-card"><div class="stat-num" id="s-left">30</div><div class="stat-label">Remaining</div></div>

  <div class="controls">
    <div class="view-tabs">

    </div>

  <div id="cal-view"></div>
  <div id="list-view" style="display:none"></div>
</main>
<footer class="footer">built for your <span>data analyst</span> journey · progress saved locally</footer>
<script>
const DAYS=[
  {d:1,wk:1,tag:"sql",tl:"SQL",topic:"Setup + SELECT basics",tasks:"Install SQLiteOnline · SELECT, FROM, WHERE · Run 5 queries on sample data"},
  {d:2,wk:1,tag:"sql",tl:"SQL",topic:"Filtering + sorting",tasks:"AND, OR, NOT, IN, BETWEEN · ORDER BY, LIMIT · Ask AI to explain 2 queries"},
  {d:3,wk:1,tag:"sql",tl:"SQL",topic:"GROUP BY + aggregations",tasks:"COUNT, SUM, AVG, MIN, MAX · GROUP BY + HAVING · Sales by region queries"},
  {d:4,wk:1,tag:"sql",tl:"SQL",topic:"JOINs — INNER + LEFT",tasks:"INNER JOIN concept · LEFT JOIN + NULLs · Join 2 tables, write 3 queries"},
  {d:5,wk:1,tag:"sql",tl:"SQL",topic:"RIGHT JOIN + multi-table",tasks:"RIGHT JOIN · Join 3 tables · Business question → SQL with AI"},
  {d:6,wk:1,tag:"sql",tl:"SQL",topic:"Practice day",tasks:"10 mixed HackerRank problems · Try alone first · AI reviews solutions"},
  {d:7,wk:1,tag:"rest",tl:"Review",topic:"Week 1 review",tasks:"Redo 2–3 hard queries · Write a cheat sheet · 1 hour max"},
  {d:8,wk:2,tag:"sql",tl:"SQL",topic:"Subqueries",tasks:"Subquery in WHERE + FROM · Top 5 customers by revenue"},
  {d:9,wk:2,tag:"sql",tl:"SQL",topic:"Window functions",tasks:"ROW_NUMBER, RANK, DENSE_RANK · OVER PARTITION BY · LAG + LEAD"},
  {d:10,wk:2,tag:"sql",tl:"SQL",topic:"CASE + CTEs",tasks:"CASE WHEN THEN ELSE · WITH clause · Paste slow query → AI optimize"},
  {d:11,wk:2,tag:"py",tl:"Python",topic:"Python basics",tasks:"Variables, lists, dicts · If/else, for loops · 5 programs in Colab"},
  {d:12,wk:2,tag:"py",tl:"Python",topic:"Functions + Pandas intro",tasks:"Define functions · read_csv() · df.head(), df.info(), df.shape"},
  {d:13,wk:2,tag:"py",tl:"Python",topic:"Pandas filtering + groupby",tasks:"df[df['col']>v] filtering · groupby().agg() · Explore a Kaggle CSV"},

  {d:15,wk:3,tag:"py",tl:"Python",topic:"Cleaning — nulls + types",tasks:"isnull(), fillna(), dropna() · astype() · Clean a messy CSV"},
  {d:16,wk:3,tag:"py",tl:"Python",topic:"Cleaning — dupes + strings",tasks:"drop_duplicates(), str.strip() · Rename columns · NumPy basics"},
  {d:17,wk:3,tag:"py",tl:"Python",topic:"EDA — exploratory analysis",tasks:"describe(), value_counts(), corr() · Find 5 patterns, write insights"},

  {d:21,wk:3,tag:"rest",tl:"Review",topic:"Week 3 review + prep",tasks:"Decide project topic · Find Kaggle dataset · Write problem statement"},
  {d:22,wk:4,tag:"proj",tl:"Project",topic:"Problem statement",tasks:"Write the business problem · List 4–5 data questions · Explore dataset"},
  {d:23,wk:4,tag:"proj",tl:"Project",topic:"Data cleaning (Python)",tasks:"Clean full project dataset · Fix nulls, types, dupes · Document changes"},
  {d:24,wk:4,tag:"proj",tl:"Project",topic:"SQL analysis",tasks:"Write 5–8 SQL queries · JOINs, GROUP BY, window fns · Save as CSV"},
  {d:25,wk:4,tag:"proj",tl:"Project",topic:"Python EDA",tasks:"Full EDA: distributions + trends · Find 3–5 patterns · Ask AI for more"},
  {d:26,wk:4,tag:"proj",tl:"Project",topic:"Build the dashboard",tasks:"5–6 charts in Power BI · Connect SQL outputs · Add filters"},
  {d:27,wk:4,tag:"proj",tl:"Project",topic:"Insights + recommendations",tasks:"3 key findings (1 sentence each) · 2 business recommendations"},
  {d:28,wk:4,tag:"proj",tl:"Project",topic:"Write README",tasks:"Problem → approach → findings → tools · Screenshots · Push to GitHub"},
  {d:29,wk:4,tag:"proj",tl:"Project",topic:"Practice out loud",tasks:"5-min walkthrough · What was hardest? What did you find? · Record once"},
  {d:30,wk:4,tag:"proj",tl:"Project",topic:"Final polish + resume",tasks:"Add to resume with 2 bullets · Update LinkedIn · AI interview prep"},
];
const WEEKS=[
  {n:1,hd:"wk1-hd",cc:"wk1c",dc:"done-wk1",label:"Week 1",name:"SQL foundations",days:[1,2,3,4,5,6,7]},
  {n:2,hd:"wk2-hd",cc:"wk2c",dc:"done-wk2",label:"Week 2",name:"Advanced SQL + Python start",days:[8,9,10,11,12,13,14]},
  {n:3,hd:"wk3-hd",cc:"wk3c",dc:"done-wk3",label:"Week 3",name:"Python deep + Visualization",days:[15,16,17,18,19,20,21]},
  {n:4,hd:"wk4-hd",cc:"wk4c",dc:"done-wk4",label:"Week 4",name:"Portfolio project",days:[22,23,24,25,26,27,28,29,30]},
];
const DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem('da30_v3')||'[]'))}catch(e){}
function save(){try{localStorage.setItem('da30_v3',JSON.stringify([...done]))}catch(e){}}
function toggle(d){done.has(d)?done.delete(d):done.add(d);save();render();}
function resetAll(){if(confirm('Reset all progress?')){done.clear();save();render();}}
function getStreak(){let s=0;for(let i=1;i<=30;i++){if(done.has(i))s++;else break;}return s;}
function updateStats(){
  const n=done.size,pct=Math.round(n/30*100);
  document.getElementById('s-done').textContent=n;
  document.getElementById('s-left').textContent=30-n;
  document.getElementById('s-pct').textContent=pct+'%';
  document.getElementById('s-streak').textContent=getStreak();
  document.getElementById('pbar').style.width=pct+'%';
  document.getElementById('pl-done').textContent=n+' / 30 days done';
  document.getElementById('pl-pct').textContent=pct+'%';
}
function checkSVG(){return`<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 5.5l3 3 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function checkSVGSm(){return`<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5l2.5 2.5 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function renderCal(){
  const el=document.getElementById('cal-view');
  el.innerHTML='';
  WEEKS.forEach(wk=>{
    const dc=wk.days.filter(d=>done.has(d)).length;
    const pct=Math.round(dc/wk.days.length*100);
    let html=`<div class="week-section"><div class="week-header ${wk.hd}">
      <span class="wk-badge">${wk.label}</span>
      <span class="wk-title">${wk.name}</span>
      <div class="wk-progress">
        <span class="wk-count">${dc}/${wk.days.length}</span>
        <div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>
      </div>
    </div><div class="cal-grid">`;
    wk.days.forEach(d=>{
      const day=DAYS[d-1];
      const isDone=done.has(d);
      const dc2=isDone?` ${wk.dc}`:'';
      html+=`<div class="day-cell${dc2}" onclick="toggle(${d})">
        <div class="dc-top">
          <span class="dc-num">${d}</span>
          <div class="dc-circle">${isDone?checkSVGSm():''}</div>
        </div>
        <div class="dc-topic">${day.topic}</div>
        <span class="dc-tag tag-${day.tag}">${day.tl}</span>
      </div>`;
    });
    html+='</div></div>';
    el.innerHTML+=html;
  });
}
function renderList(){
  const el=document.getElementById('list-view');
  el.innerHTML='';
  WEEKS.forEach(wk=>{
    const dc=wk.days.filter(d=>done.has(d)).length;
    const pct=Math.round(dc/wk.days.length*100);
    let html=`<div class="week-section"><div class="week-header ${wk.hd}">
      <span class="wk-badge">${wk.label}</span>
      <span class="wk-title">${wk.name}</span>
      <div class="wk-progress">
        <span class="wk-count">${dc}/${wk.days.length}</span>
        <div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`;
    wk.days.forEach(d=>{
      const day=DAYS[d-1];
      const isDone=done.has(d);
      const dc2=isDone?` ${wk.dc}`:'';
      html+=`<div class="cl-item${dc2} ${wk.cc}" onclick="toggle(${d})">
        <div class="cl-circle">${isDone?checkSVG():''}</div>
        <div class="cl-body">
          <div class="cl-meta">
            <span class="cl-badge">Day ${d} · ${DN[(d-1)%7]}</span>
            <span class="dc-tag tag-${day.tag}">${day.tl}</span>
          </div>
          <div class="cl-title">${day.topic}</div>
          <div class="cl-tasks">${day.tasks}</div>
        </div>
      </div>`;
    });
    html+='</div>';
    el.innerHTML+=html;
  });
}
function render(){renderCal();renderList();updateStats();}
function sw(v){
  document.getElementById('cal-view').style.display=v==='cal'?'block':'none';
  document.getElementById('list-view').style.display=v==='list'?'block':'none';
  document.getElementById('btn-cal').classList.toggle('active',v==='cal');
  document.getElementById('btn-list').classList.toggle('active',v==='list');
}
render();
</script>
</body>
</html>
